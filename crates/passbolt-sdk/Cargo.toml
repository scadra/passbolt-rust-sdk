[package]
name = "passbolt-sdk"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "Passbolt SDK — Rust library for the Passbolt API"
license = "AGPL-3.0-or-later"

[features]
default = ["native"]
native = ["dep:reqwest", "dep:tokio"]
totp = ["dep:totp-rs"]
full = ["native", "totp"]
# Interop tests with OpenPGP.js: needs node and `npm ci --prefix tests/interop`.
interop = []
# The gopenpgp engine, the library of go-passbolt: needs Go to build (`GO`, else `go`).
gopenpgp = []
# The OpenPGP.js engine: in an embedded QuickJS, or in WebAssembly the OpenPGP.js of the page.
openpgpjs = [
    "dep:rquickjs", "dep:aes", "dep:aes-gcm", "dep:cbc", "dep:ctr", "dep:hkdf", "dep:sha2",
    "dep:wasm-bindgen", "dep:js-sys", "dep:wasm-bindgen-futures", "dep:send_wrapper",
]

[dependencies]
# Errors
thiserror = "2"

# Sérialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sécurité mémoire
zeroize = { version = "1", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }

# OpenPGP — pure Rust
pgp = { version = "0.21", default-features = false }
rand = "0.8"

# HIBP password breach check
sha1 = "0.10"

# Utils
chrono = { version = "0.4.34", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
# Resource type schemas (`pattern`)
regex-lite = "0.1"

# Async runtime (gated behind native feature)
tokio = { version = "1", features = ["full"], optional = true }

# HTTP client (gated behind native feature)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "rustls-tls-native-roots", "cookies"], default-features = false, optional = true }

# TOTP (gated behind totp feature)
totp-rs = { version = "5", features = ["serde_support", "gen_secret"], optional = true }

# OpenPGP.js engine (gated behind openpgpjs feature): QuickJS and the WebCrypto it needs.
# In the browser, the engine runs on the OpenPGP.js of the page instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rquickjs = { version = "0.14", features = ["parallel"], optional = true }
aes = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
cbc = { version = "0.1", features = ["alloc"], optional = true }
ctr = { version = "0.9", optional = true }
hkdf = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

# In the browser, rPGP reads the clock and the randomness through the Web APIs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
pgp = { version = "0.21", default-features = false, features = ["wasm"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
send_wrapper = { version = "0.6", features = ["futures"], optional = true }

[lints]
workspace = true

[dev-dependencies]
futures-executor = "0.3"
proptest = "1"
rstest = "0.28"
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["native"]
