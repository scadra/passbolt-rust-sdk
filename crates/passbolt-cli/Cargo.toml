[package]
name = "passbolt-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Passbolt CLI — Rust alternative to go-passbolt-cli"
license = "AGPL-3.0-or-later"

[[bin]]
name = "passbolt"
path = "src/main.rs"

[dependencies]
# SDK
passbolt-sdk = { path = "../passbolt-sdk", features = ["native", "totp"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"

# Async
tokio = { version = "1", features = ["full"] }

# Erreurs
anyhow = "1"

# Sécurité mémoire
secrecy = { version = "0.10", features = ["serde"] }

# Sérialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config & paths
config = "0.14"
directories = "5"
toml = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Output
unicode-width = "0.2"
indicatif = "0.17"

# --filter expressions, as go-passbolt-cli evaluates them (cel-go)
cel = { version = "0.15", default-features = false, features = ["chrono", "regex"] }

# Utils
rpassword = "7"
chrono = { version = "0.4", features = ["serde"] }

# KeePass export
keepass = { version = "0.6", features = ["save_kdbx4"] }
secstr = "0.5"
# KDBX 3.1 writer (the keepass crate only writes KDBX 4)
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
flate2 = "1"
rand = "0.8"
salsa20 = "0.10"
sha2 = "0.10"
# KDBX 3 and 4 reader
argon2 = "0.5"
chacha20 = "0.9"
hmac = "0.12"
xml-rs = "0.8"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
# End-to-end tests against a real server: scripts/e2e.sh
e2e = []

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]

[[test]]
name = "e2e_migration"
path = "tests/e2e_migration/main.rs"
required-features = ["e2e"]

[dev-dependencies]
pgp = { version = "0.21", default-features = false }
totp-rs = "5"
assert_cmd = "2"
predicates = "3"
tokio-test = "0.4"
tempfile = "3"
rstest = "0.28"

[lints]
workspace = true
