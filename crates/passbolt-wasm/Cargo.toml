[package]
name = "passbolt-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Passbolt SDK — WASM binding for browser extensions"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
passbolt-sdk = { path = "../passbolt-sdk", default-features = false }

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"

# Web APIs
web-sys = { version = "0.3", features = [
    "Headers",
    "Request",
    "RequestInit",
    "RequestCredentials",
    "RequestMode",
    "Response",
] }
js-sys = "0.3"

# Serde for type conversion
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CRITICAL: enables crypto.getRandomValues() for rand/pgp in WASM
getrandom = { version = "0.2", features = ["js"] }
# The SDK generates v4 UUIDs; `js` gives uuid a randomness source on wasm32.
uuid = { version = "1", features = ["js"] }
secrecy = "0.10.3"

# In the browser, the OpenPGP.js engine runs on the OpenPGP.js the page gives.
[target.'cfg(target_arch = "wasm32")'.dependencies]
passbolt-sdk = { path = "../passbolt-sdk", default-features = false, features = ["openpgpjs"] }

[dev-dependencies]
futures-executor = "0.3"
rstest = "0.28"
serde_json = "1"
wasm-bindgen-test = "0.3"

[lints]
workspace = true
