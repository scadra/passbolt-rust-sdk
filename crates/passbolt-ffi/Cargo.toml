[package]
name = "passbolt-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Passbolt SDK — Multi-language FFI bindings (Python, Kotlin, Swift, C#)"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "lib"]
name = "passbolt_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
passbolt-sdk = { path = "../passbolt-sdk", features = ["native", "totp"] }
uniffi = { version = "0.29", features = ["cli"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
secrecy = "0.10"
chrono = "0.4"
serde = "1"
serde_json = "1"

[dev-dependencies]
rstest = "0.28"
wiremock = "0.6"
uuid = { version = "1", features = ["v4"] }
url = "2"

[lints]
workspace = true
