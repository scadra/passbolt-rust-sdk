name: SDK and CLI builds

# Builds the CLI for every desktop platform and the SDK for JS/TS, Python, Java, Go, .NET,
# Ruby, iOS and Android. Each run uploads one `passbolt-<version>` payload with all of them;
# a `v*` tag also attaches it to a GitHub release and publishes the packages on the enabled
# registries (docs/contributing/publishing.md).

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/sdk.yml
      - packaging/**
      - scripts/sdk-bindings.sh
      - crates/passbolt-ffi/**
      - crates/passbolt-wasm/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Generators of the languages UniFFI does not ship, at the UniFFI version of Cargo.lock.
  UNIFFI_BINDGEN_GO: v0.5.0+v0.29.5
  UNIFFI_BINDGEN_CS: v0.10.0+v0.29.4
  UNIFFI_BINDGEN_JAVA: 0.2.1
  CARGO_NDK: 4.1.2
  JNA: 5.14.0
  GRADLE: 8.11.1
  # The repositories Go and SwiftPM install from; the Go module path is the Go one's.
  GO_REPOSITORY: ${{ vars.GO_REPOSITORY || 'scadra/passbolt-sdk-go' }}
  SWIFT_REPOSITORY: ${{ vars.SWIFT_REPOSITORY || 'scadra/passbolt-sdk-swift' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.version.outputs.sdk }}
      cli: ${{ steps.version.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version() {
            cargo metadata --format-version 1 --no-deps \
              | jq -r --arg name "$1" '.packages[] | select(.name == $name) | .version'
          }
          echo "sdk=$(version passbolt-ffi)" >> "$GITHUB_OUTPUT"
          echo "cli=$(version passbolt-cli)" >> "$GITHUB_OUTPUT"

  # The CLI, and the native library the SDK bindings load, for each desktop platform.
  native:
    name: Native (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, ffi: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, ffi: true }
          # Static binary for any Linux; no SDK library (musl cdylibs are not portable).
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, ffi: false }
          - { target: x86_64-apple-darwin, os: macos-14, ffi: true }
          - { target: aarch64-apple-darwin, os: macos-14, ffi: true }
          - { target: x86_64-pc-windows-msvc, os: windows-2022, ffi: true }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: CLI
        run: cargo build --release --locked -p passbolt-cli --target "$TARGET"
      # The bindings are generated from the UniFFI metadata symbols: a stripped library has none.
      - name: SDK library
        if: matrix.ffi
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
        run: cargo build --release --locked -p passbolt-ffi --lib --target "$TARGET"
      # Go links the static library: it also needs the system libraries Rust prints, without
      # colours: cgo refuses a flag holding an escape code.
      - name: SDK static library
        if: matrix.ffi && runner.os != 'Windows'
        run: |
          cargo rustc --color never --release --locked -p passbolt-ffi --lib --crate-type staticlib \
            --target "$TARGET" -- --print native-static-libs 2> static.log || { cat static.log; exit 1; }
          sed -n 's/.*native-static-libs: //p' static.log | tail -n 1 > native-static-libs.txt
          grep -Eqx -- '-[-A-Za-z0-9_.,/= ]+' native-static-libs.txt
      - name: Package
        run: |
          name="passbolt-cli-${{ needs.version.outputs.cli }}-$TARGET"
          mkdir -p dist "$name"
          exe=""
          [[ "$TARGET" == *windows* ]] && exe=".exe"
          cp "target/$TARGET/release/passbolt$exe" LICENSE README.md "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            7z a "dist/$name.zip" "$name" > /dev/null
          else
            tar czf "dist/$name.tar.gz" "$name"
          fi
          if ${{ matrix.ffi }}; then
            mkdir -p native
            for file in libpassbolt_ffi.so libpassbolt_ffi.dylib passbolt_ffi.dll libpassbolt_ffi.a; do
              if [[ -f "target/$TARGET/release/$file" ]]; then
                cp "target/$TARGET/release/$file" native/
              fi
            done
            if [[ -f native-static-libs.txt ]]; then
              cp native-static-libs.txt native/
            fi
          fi
      - name: Smoke test
        if: "!contains(matrix.target, 'x86_64-apple')"
        run: |
          exe=""
          [[ "$TARGET" == *windows* ]] && exe=".exe"
          "target/$TARGET/release/passbolt$exe" --version
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
      - if: matrix.ffi
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native/

  # Binding sources of every UniFFI language, read from the Linux library.
  bindings:
    name: Bindings sources
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64-unknown-linux-gnu
          path: native
      - id: generators
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/uniffi-bindgen-go
            ~/.cargo/bin/uniffi-bindgen-cs
            ~/.cargo/bin/uniffi-bindgen-java
          key: uniffi-generators-${{ env.UNIFFI_BINDGEN_GO }}-${{ env.UNIFFI_BINDGEN_CS }}-${{ env.UNIFFI_BINDGEN_JAVA }}
      - name: Install the Go, C# and Java generators
        if: steps.generators.outputs.cache-hit != 'true'
        run: |
          cargo install --locked uniffi-bindgen-go \
            --git https://github.com/NordSecurity/uniffi-bindgen-go --tag "$UNIFFI_BINDGEN_GO"
          cargo install --locked uniffi-bindgen-cs \
            --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS"
          cargo install --locked uniffi-bindgen-java --version "$UNIFFI_BINDGEN_JAVA"
      - run: bash scripts/sdk-bindings.sh native/libpassbolt_ffi.so bindings
      - uses: actions/upload-artifact@v4
        with:
          name: bindings
          path: bindings/
          if-no-files-found: error

  python:
    name: Python (${{ matrix.target }}, ${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64, smoke: true }
          - { os: ubuntu-22.04-arm, target: aarch64, smoke: true }
          - { os: macos-14, target: x86_64, smoke: false }
          - { os: macos-14, target: aarch64, smoke: true }
          - { os: windows-2022, target: x64, smoke: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # maturin generates the bindings from the library: its UniFFI symbols must stay.
      - uses: PyO3/maturin-action@v1
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
        with:
          working-directory: crates/passbolt-ffi
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          python -m pip install --no-index --find-links crates/passbolt-ffi/dist switch-case-passbolt-sdk
          python packaging/smoke/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-python-${{ matrix.os }}-${{ matrix.target }}
          path: crates/passbolt-ffi/dist/*.whl

  js:
    name: JavaScript / TypeScript
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The CLI must match the wasm-bindgen version of Cargo.lock.
      - name: Install wasm-bindgen
        run: |
          version=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: cargo build --release --locked -p passbolt-wasm --target wasm32-unknown-unknown
      - name: Package
        run: |
          pkg=build/js
          wasm=target/wasm32-unknown-unknown/release/passbolt_wasm.wasm
          mkdir -p "$pkg" dist
          cp packaging/js/package.json packaging/js/README.md LICENSE "$pkg/"
          wasm-bindgen --target bundler --out-dir "$pkg/bundler" "$wasm"
          wasm-bindgen --target nodejs --out-dir "$pkg/node" "$wasm"
          npm pkg set --prefix "$pkg" version="${{ needs.version.outputs.sdk }}"
          npm pack "./$pkg" --pack-destination dist
      - name: Smoke test
        run: |
          mkdir -p build/smoke && cd build/smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../../dist/*.tgz
          cp ../../packaging/smoke/smoke.cjs . && node smoke.cjs
      # The declarations type what the session takes and returns: a typed use must compile.
      - name: TypeScript types
        working-directory: build/smoke
        run: |
          npm install --no-audit --no-fund typescript@5.8.3
          cp ../../packaging/smoke/smoke.ts .
          npx tsc --strict --noEmit --target es2022 --lib esnext --module nodenext smoke.ts
      # The declarations against the SDK: its fixtures, serialized as the session returns them.
      - name: TypeScript types match the SDK
        run: |
          mkdir -p build/types
          cargo run -q --locked -p passbolt-wasm --example typescript_samples > build/types/samples.ts
          cp crates/passbolt-wasm/src/types.d.ts build/types/
          build/smoke/node_modules/.bin/tsc --strict --noEmit --target es2022 --module nodenext build/types/samples.ts
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-js
          path: dist/*.tgz

  java:
    name: Java
    needs: [version, bindings]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: bindings
          path: bindings
      - name: Package
        run: |
          curl -fsSLo jna.jar "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA/jna-$JNA.jar"
          # JNA looks for the library under <os>-<arch>/ on the classpath.
          declare -A prefix=(
            [x86_64-unknown-linux-gnu]=linux-x86-64 [aarch64-unknown-linux-gnu]=linux-aarch64
            [x86_64-apple-darwin]=darwin-x86-64 [aarch64-apple-darwin]=darwin-aarch64
            [x86_64-pc-windows-msvc]=win32-x86-64
          )
          for target in "${!prefix[@]}"; do
            mkdir -p "build/resources/${prefix[$target]}"
            find "native/native-$target" \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) \
              -exec cp {} "build/resources/${prefix[$target]}/" \;
          done
          name="passbolt-sdk-${{ needs.version.outputs.sdk }}"
          mkdir -p build/classes dist
          javac --release 21 -nowarn -cp jna.jar -d build/classes $(find bindings/java -name '*.java')
          jar --create --file "dist/$name.jar" -C build/classes . -C build/resources .
          jar --create --file "dist/$name-sources.jar" -C bindings/java .
          cp jna.jar "dist/jna-$JNA.jar"
      - name: Smoke test
        run: |
          javac -cp "dist/*" -d build/smoke packaging/smoke/Smoke.java
          java -cp "dist/*:build/smoke" Smoke
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-java
          path: dist/*

  dotnet:
    name: .NET
    needs: [version, bindings]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: bindings
          path: bindings
      - name: Package
        run: |
          pkg=build/dotnet
          mkdir -p "$pkg/generated"
          cp packaging/dotnet/Passbolt.Sdk.csproj "$pkg/"
          cp -r bindings/csharp/. "$pkg/generated/"
          declare -A rid=(
            [x86_64-unknown-linux-gnu]=linux-x64 [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64 [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
          )
          for target in "${!rid[@]}"; do
            mkdir -p "$pkg/runtimes/${rid[$target]}/native"
            find "native/native-$target" \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) \
              -exec cp {} "$pkg/runtimes/${rid[$target]}/native/" \;
          done
          dotnet pack "$pkg" -c Release -p:Version="${{ needs.version.outputs.sdk }}" -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dotnet
          path: dist/*.nupkg

  go:
    name: Go
    needs: [version, bindings]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: bindings
          path: bindings
      # A module linking the static library of each platform; Windows is not covered (cgo
      # uses MinGW, the library is built with MSVC).
      - name: Package
        run: |
          pkg=build/go/passbolt-sdk-go
          mkdir -p "$pkg" dist
          find bindings/go \( -name '*.go' -o -name '*.h' \) -exec cp {} "$pkg/" \;
          # The link files join the package the generator wrote.
          package=$(sed -n 's/^package //p' "$pkg"/*.go | head -n 1)
          test -n "$package"
          printf 'module github.com/%s\n\ngo 1.21\n' "$GO_REPOSITORY" > "$pkg/go.mod"
          declare -A platform=(
            [x86_64-unknown-linux-gnu]=linux_amd64 [aarch64-unknown-linux-gnu]=linux_arm64
            [x86_64-apple-darwin]=darwin_amd64 [aarch64-apple-darwin]=darwin_arm64
          )
          for target in "${!platform[@]}"; do
            p="${platform[$target]}"
            mkdir -p "$pkg/lib/$p"
            cp "native/native-$target/libpassbolt_ffi.a" "$pkg/lib/$p/"
            {
              echo "//go:build ${p%_*} && ${p#*_}"
              echo
              echo "package $package"
              echo
              echo "// #cgo LDFLAGS: -L\${SRCDIR}/lib/$p -lpassbolt_ffi $(cat "native/native-$target/native-static-libs.txt")"
              echo 'import "C"'
            } > "$pkg/link_$p.go"
          done
          cp LICENSE "$pkg/"
          tar czf "dist/passbolt-sdk-go-${{ needs.version.outputs.sdk }}.tar.gz" -C build/go passbolt-sdk-go
      - name: Smoke test
        run: |
          mkdir -p build/smoke && cd build/smoke
          module="github.com/$GO_REPOSITORY"
          printf 'module smoke\n\ngo 1.21\n\nrequire %s v0.0.0\n\nreplace %s => ../go/passbolt-sdk-go\n' "$module" "$module" > go.mod
          printf 'package main\n\nimport _ "%s"\n\nfunc main() {}\n' "$module" > main.go
          CGO_ENABLED=1 go build -o smoke . && ./smoke
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-go
          path: dist/*

  ruby:
    name: Ruby
    needs: [version, bindings]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: bindings
          path: bindings
      - name: Package
        run: |
          pkg=build/ruby
          mkdir -p "$pkg/lib" dist
          cp packaging/ruby/passbolt-sdk.gemspec LICENSE "$pkg/"
          cp packaging/ruby/passbolt_sdk.rb "$pkg/lib/"
          # Load the library shipped in the gem, not one from the system library path.
          sed "s/ffi_lib 'passbolt_ffi'/ffi_lib PASSBOLT_FFI_LIBRARY/" bindings/ruby/passbolt_ffi.rb \
            > "$pkg/lib/passbolt_ffi.rb"
          grep -q "ffi_lib PASSBOLT_FFI_LIBRARY" "$pkg/lib/passbolt_ffi.rb"
          # FFI::Platform::OS-ARCH, as lib/passbolt_sdk.rb looks it up.
          declare -A platform=(
            [x86_64-unknown-linux-gnu]=linux-x86_64 [aarch64-unknown-linux-gnu]=linux-aarch64
            [x86_64-apple-darwin]=darwin-x86_64 [aarch64-apple-darwin]=darwin-aarch64
            [x86_64-pc-windows-msvc]=windows-x86_64
          )
          for target in "${!platform[@]}"; do
            mkdir -p "$pkg/lib/native/${platform[$target]}"
            find "native/native-$target" \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) \
              -exec cp {} "$pkg/lib/native/${platform[$target]}/" \;
          done
          (cd "$pkg" && SDK_VERSION="${{ needs.version.outputs.sdk }}" gem build passbolt-sdk.gemspec)
          mv "$pkg"/*.gem dist/
      - name: Smoke test
        run: |
          gem install --no-document dist/*.gem
          ruby -e '
            require "passbolt_sdk"
            begin
              PassboltFfi.get_key_fingerprint("not a key")
            rescue StandardError => e
              puts "ok: #{e.class}"
            else
              abort "expected a crypto error"
            end'
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-ruby
          path: dist/*.gem

  ios:
    name: iOS
    needs: [version, bindings]
    runs-on: macos-14
    env:
      TARGETS: aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: bindings
          path: bindings
      - name: Static libraries
        run: |
          for target in $TARGETS; do
            cargo rustc --release --locked -p passbolt-ffi --lib --crate-type staticlib --target "$target"
          done
      - name: Package
        run: |
          pkg=build/PassboltSDK
          mkdir -p build/headers build/simulator "$pkg/Sources/PassboltSDK" dist
          cp bindings/swift/passbolt_ffiFFI.h build/headers/
          cp bindings/swift/passbolt_ffiFFI.modulemap build/headers/module.modulemap
          lipo -create \
            target/aarch64-apple-ios-sim/release/libpassbolt_ffi.a \
            target/x86_64-apple-ios/release/libpassbolt_ffi.a \
            -output build/simulator/libpassbolt_ffi.a
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libpassbolt_ffi.a -headers build/headers \
            -library build/simulator/libpassbolt_ffi.a -headers build/headers \
            -output "$pkg/passbolt_ffiFFI.xcframework"
          cp bindings/swift/passbolt_ffi.swift "$pkg/Sources/PassboltSDK/"
          cp packaging/swift/Package.swift LICENSE "$pkg/"
          (cd build && zip -qry "../dist/PassboltSDK-ios-${{ needs.version.outputs.sdk }}.zip" PassboltSDK)
          # The XCFramework alone, attached to the release: the Swift package repository points at it.
          (cd "$pkg" && zip -qry "../../dist/passbolt_ffiFFI.xcframework.zip" passbolt_ffiFFI.xcframework)
      - name: Smoke test
        working-directory: build/PassboltSDK
        run: xcodebuild build -scheme PassboltSDK -destination 'generic/platform=iOS Simulator' -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-ios
          path: dist/*

  android:
    name: Android
    needs: [version, bindings]
    runs-on: ubuntu-22.04
    env:
      # 16 KB pages, required by Android 15 devices.
      CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
      CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: bindings
          path: bindings
      - run: cargo install --locked cargo-ndk --version "$CARGO_NDK"
      # The NDK of the runner image: `env.` only reads the workflow's variables, not the runner's.
      - name: Native libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          test -d "$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o build/android/jniLibs \
            build --release --locked -p passbolt-ffi --lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE }}
      # The Kotlin bindings and jni/<abi>/ in one AAR; apps also depend on net.java.dev.jna:jna (aar).
      - name: AAR
        run: |
          gradle -p packaging/android --no-daemon assembleRelease
          aar=packaging/android/build/outputs/aar/passbolt-sdk-release.aar
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$aar" | grep -q "jni/$abi/libpassbolt_ffi.so"
          done
          unzip -p "$aar" classes.jar > classes.jar
          unzip -l classes.jar | grep -q 'com/passbolt/sdk/PassboltClient.class'
          mkdir -p dist
          cp "$aar" "dist/passbolt-sdk-android-${{ needs.version.outputs.sdk }}.aar"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-android
          path: dist/*

  # Everything in one artifact; a tag also publishes it as a GitHub release.
  payload:
    name: Payload
    needs: [version, native, python, js, java, dotnet, go, ruby, ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: payload/cli
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: payload/sdk
          merge-multiple: true
      - name: Checksums
        working-directory: payload
        run: find . -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: passbolt-${{ needs.version.outputs.sdk }}
          path: payload/
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            payload/SHA256SUMS payload/cli/* payload/sdk/*

  # Publishing: on a `v<sdk version>` tag, the packages built and tested above go to each registry whose
  # repository variable PUBLISH_<REGISTRY> is `true`; the others are skipped.
  release-check:
    name: Release check
    needs: [version, payload]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: The tag names the SDK version
        run: test "$GITHUB_REF_NAME" = "v${{ needs.version.outputs.sdk }}"

  publish-npm:
    name: Publish npm
    needs: release-check
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: sdk-js
          path: dist
      - run: npm publish --access public --provenance dist/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Trusted Publishing: PyPI trusts this workflow and its `pypi` environment, no token.
  publish-pypi:
    name: Publish PyPI
    needs: release-check
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Trusted Publishing: nuget.org trusts this workflow and its `nuget` environment, and gives a
  # short-lived key to the profile of NUGET_USER.
  publish-nuget:
    name: Publish NuGet
    needs: release-check
    if: vars.PUBLISH_NUGET == 'true'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: sdk-dotnet
          path: dist
      - id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push dist/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  # Trusted Publishing: rubygems.org trusts this workflow and its `rubygems` environment.
  publish-rubygems:
    name: Publish RubyGems
    needs: release-check
    if: vars.PUBLISH_RUBYGEMS == 'true'
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/download-artifact@v4
        with:
          name: sdk-ruby
          path: dist
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - run: for gem in dist/*.gem; do gem push "$gem"; done

  # The Java jar and the Android AAR, signed, through the Central Portal API.
  publish-maven:
    name: Publish Maven Central
    needs: [version, release-check]
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: ubuntu-latest
    env:
      MAVEN_GROUP: ${{ vars.MAVEN_GROUP || 'io.github.scadra' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdk-java
          path: sdk
      - uses: actions/download-artifact@v4
        with:
          name: sdk-android
          path: sdk
      - uses: actions/download-artifact@v4
        with:
          name: bindings
          path: bindings
      - name: Bundle
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          gpg --batch --import <<< "$MAVEN_GPG_PRIVATE_KEY"
          export MAVEN_GPG_KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          test -n "$MAVEN_GPG_KEY_ID"
          bash scripts/maven-bundle.sh "$MAVEN_GROUP" "${{ needs.version.outputs.sdk }}" sdk bindings/kotlin bundle.zip
      - name: Upload
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          curl --fail-with-body -X POST -H "Authorization: Bearer $token" -F bundle=@bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=passbolt-sdk-${{ needs.version.outputs.sdk }}&publishingType=AUTOMATIC"

  # Under `<prefix>-passbolt-sdk` and `<prefix>-passbolt-cli`, the code unchanged.
  publish-crates:
    name: Publish crates.io
    needs: release-check
    if: vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/publish-crates.sh "${{ vars.CRATES_PREFIX || 'switch-case' }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
