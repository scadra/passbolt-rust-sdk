name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, lint and headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p passbolt-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: bash scripts/license-headers.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # What the SDK writes, read by OpenPGP.js as the browser extension does.
      - run: npm ci --prefix tests/interop --no-audit --no-fund
      - run: cargo test -p passbolt-sdk --features interop --test it interop

  # The engines the default build leaves out: gopenpgp, the default engine of the released
  # binaries, and Sequoia, on Nettle.
  engines:
    name: OpenPGP engines (gopenpgp, Sequoia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/passbolt-sdk/gopenpgp/go.mod
          cache-dependency-path: crates/passbolt-sdk/gopenpgp/go.sum
      - run: sudo apt-get update && sudo apt-get install -y nettle-dev libclang-dev
      - run: go vet ./... && go test -race ./...
        working-directory: crates/passbolt-sdk/gopenpgp
      - run: cargo clippy --workspace --all-targets --features passbolt-sdk/gopenpgp,passbolt-sdk/sequoia -- -D warnings
      - run: cargo test --workspace --features passbolt-sdk/gopenpgp,passbolt-sdk/sequoia

  wasm:
    name: WASM tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The runner must match the wasm-bindgen version of Cargo.lock.
      - name: Install wasm-bindgen-test-runner
        run: |
          version=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
      # The interop test imports OpenPGP.js from there, as the browser extension runs it.
      - run: npm ci --prefix tests/interop --no-audit --no-fund
      - run: cargo test -p passbolt-wasm --target wasm32-unknown-unknown

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0
          git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore
          --redact --no-banner --verbose
