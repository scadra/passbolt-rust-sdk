[workspace]
members = ["crates/passbolt-sdk", "crates/passbolt-cli", "crates/passbolt-wasm", "crates/passbolt-ffi"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Too noisy — add docs incrementally later
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Common in public API types
module_name_repetitions = "allow"
# sem/set, etc. — fine
similar_names = "allow"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1

# RSA/OpenPGP are unusably slow unoptimized; this also applies to tests.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.pgp]
opt-level = 3

# KDBX key derivation: millions of AES rounds, or Argon2.
[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The OpenPGP.js engine: QuickJS, and the digests and ciphers its WebCrypto runs on.
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3
